apiVersion: apps/v1
kind: Deployment
metadata:
  name: nekouv
  labels:
    app: nekouv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nekouv
  template:
    metadata:
      labels:
        app: nekouv
    spec:
      containers:
        - name: nekouv
          # Default image works out of the box. Replace it with your own NekoUV image
          # (and adjust containerPort / probes) once it is built and pushed to a registry.
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
